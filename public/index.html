<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillMap AI</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c2033; --muted:#667; --brand:#4f46e5; --line:#e3e5ee; --ok:#16a34a; --warn:#d97706; --new:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141d; --card:#1b1e2b; --text:#e8eaf4; --muted:#9aa0b8; --brand:#818cf8; --line:#2c3042; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:860px; margin:0 auto; padding:24px 16px 64px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input[type=text], textarea, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:20px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop:focus, .drop.over { border-color:var(--brand); outline:none; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .thumbs div { position:relative; }
  .thumbs img { height:90px; border-radius:6px; border:1px solid var(--line); display:block; }
  .thumbs button { position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; border:none; background:#dc2626; color:#fff; cursor:pointer; }
  .row { margin-bottom:14px; }
  .go { background:var(--brand); color:#fff; border:none; padding:12px 20px; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  .go:disabled { opacity:.5; cursor:wait; }
  .err { color:#dc2626; margin-top:10px; }
  .tag { display:inline-block; font-size:.75rem; padding:1px 8px; border-radius:99px; border:1px solid currentColor; margin-left:6px; }
  .ja_possui { color:var(--ok); } .reforcar { color:var(--warn); } .nova { color:var(--new); }
  .item { padding:10px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:none; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:6px 0; }
  .bar i { display:block; height:100%; background:var(--brand); border-radius:3px; }
  .muted { color:var(--muted); font-size:.92rem; }
  h2 { font-size:1.15rem; margin:0 0 8px; }
  ol { margin:6px 0 0; padding-left:20px; }
  .chips span { display:inline-block; background:var(--bg); border:1px solid var(--line); border-radius:99px; padding:2px 10px; margin:2px 4px 2px 0; font-size:.88rem; }
</style>
</head>
<body>
<main>
  <h1>SkillMap AI</h1>
  <p class="sub">Informe um tema e envie o print das suas skills. Descubra quais competências, skills e trilhas são mais aderentes ao seu PDI.</p>

  <form id="form" class="card">
    <div class="row">
      <label for="tema">Tema</label>
      <input id="tema" type="text" placeholder="ex.: liderança técnica, arquitetura cloud, IA generativa" required>
    </div>
    <div class="row">
      <label for="ctx">Contexto (opcional)</label>
      <input id="ctx" type="text" placeholder="ex.: Dev Pleno, quero virar Tech Lead em 1 ano">
    </div>
    <div class="row">
      <label for="nivel">Seu nível</label>
      <select id="nivel" required>
        <option value="" disabled selected>Selecione…</option>
        <option value="junior">Trainee / Júnior</option>
        <option value="pleno">Pleno</option>
        <option value="senior">Sênior</option>
        <option value="especialista">Especialista</option>
      </select>
    </div>
    <div class="row">
      <label>Print das suas skills</label>
      <div id="drop" class="drop" tabindex="0">Cole (Ctrl+V), arraste ou clique para escolher até 5 imagens</div>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
      <div id="thumbs" class="thumbs"></div>
    </div>
    <button id="go" class="go" type="submit">Analisar</button>
    <div id="err" class="err" role="alert"></div>
  </form>

  <div id="out"></div>
</main>

<script>
const MAX = 5, MAX_BYTES = 5 * 1024 * 1024;
const imgs = []; // {mediaType, data, url}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const LABEL = { ja_possui: "já possui", reforcar: "reforçar", nova: "nova" };

function addFiles(files) {
  $("err").textContent = "";
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    if (imgs.length >= MAX) { $("err").textContent = `Máximo de ${MAX} imagens.`; break; }
    if (f.size > MAX_BYTES) { $("err").textContent = "Imagem acima de 5 MB."; continue; }
    const r = new FileReader();
    r.onload = () => { imgs.push({ mediaType: f.type, data: r.result.split(",")[1], url: r.result }); renderThumbs(); };
    r.readAsDataURL(f);
  }
}
function renderThumbs() {
  $("thumbs").innerHTML = imgs.map((im, i) => `<div><img src="${im.url}" alt="print ${i + 1}"><button type="button" data-i="${i}" aria-label="remover">×</button></div>`).join("");
}
$("thumbs").onclick = (e) => { const i = e.target.dataset?.i; if (i !== undefined) { imgs.splice(+i, 1); renderThumbs(); } };
$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over"); addFiles(e.dataTransfer.files); };
document.addEventListener("paste", (e) => addFiles([...e.clipboardData.files]));

const PLATFORM_SEARCH = {
  Udemy: (q) => `https://www.udemy.com/courses/search/?q=${encodeURIComponent(q)}`,
  Alura: (q) => `https://www.alura.com.br/busca?query=${encodeURIComponent(q)}`,
};
const pct = (n, total) => Math.round((n / total) * 100);

function render(d) {
  const skills = d.skills_que_encaixam || [];
  const cursos = d.cursos || [], uso = d.uso_pratico || [], contrib = d.contribuicao || [];
  const total = (d.nivel.aprendizado + d.nivel.uso + d.nivel.contribuicao) || 1;
  const acoes = (list) => list.map((a) => `<div class="item"><strong>${esc(a.skill)}</strong><div class="muted">${esc(a.acao)}</div></div>`).join("");

  $("out").innerHTML = `
    <div class="card"><h2>Skills que encaixam</h2>${skills.length
      ? `<div class="chips">${skills.map((s) => `<span>${esc(s.nome)}${s.nivel ? " · " + esc(s.nivel) : ""}</span>`).join("")}</div>`
      : '<p class="muted">Nenhuma skill do seu print encaixa por completo neste tema e contexto.</p>'}</div>
    <div class="card"><h2>Seu plano · ${esc(d.nivel.label)}</h2>
      <div class="muted">Aprendizado ${pct(d.nivel.aprendizado, total)}% · Uso prático ${pct(d.nivel.uso, total)}% · Contribuição ${pct(d.nivel.contribuicao, total)}%</div>
    </div>
    <div class="card"><h2>Aprendizado · cursos (Udemy ou Alura)</h2>${cursos.map((c) => `
      <div class="item"><strong>${esc(c.titulo)}</strong><span class="tag">${esc(c.plataforma)}</span>
        <div class="muted">${esc(c.skill)}. ${esc(c.motivo)}</div>
        <div class="muted"><a href="${PLATFORM_SEARCH[c.plataforma](c.busca)}" target="_blank" rel="noopener noreferrer">Buscar na ${esc(c.plataforma)}</a> · confirme o curso na plataforma</div>
      </div>`).join("") || '<p class="muted">Nenhum curso sugerido.</p>'}</div>
    ${uso.length ? `<div class="card"><h2>Uso prático</h2>${acoes(uso)}</div>` : ""}
    ${contrib.length ? `<div class="card"><h2>Contribuição</h2>${acoes(contrib)}</div>` : ""}`;
}

$("form").onsubmit = async (e) => {
  e.preventDefault();
  $("err").textContent = "";
  if (!imgs.length) { $("err").textContent = "Envie ao menos um print."; return; }
  $("go").disabled = true; $("go").textContent = "Analisando…"; $("out").innerHTML = "";
  try {
    const r = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tema: $("tema").value, contexto: $("ctx").value, nivel: $("nivel").value, imagens: imgs.map(({ mediaType, data }) => ({ mediaType, data })) }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.erro || "Erro inesperado.");
    render(d);
  } catch (err) {
    $("err").textContent = err.message;
  } finally {
    $("go").disabled = false; $("go").textContent = "Analisar";
  }
};
</script>
</body>
</html>
